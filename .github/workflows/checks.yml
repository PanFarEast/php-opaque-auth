name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        variant: ['cli', 'zts']
    steps:
      - uses: actions/checkout@v4
      - name: Build PHP and Rust test environment
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} --build-arg PHP_VARIANT=${{ matrix.variant }} -t opaque-check:${{ matrix.php }}-${{ matrix.variant }} -f tests/Dockerfile .
      - name: Check extension, interoperability, and local PIE installation
        shell: bash
        run: |
          set -o pipefail
          git archive HEAD | docker run --rm -i -e OPAQUE_TEST_PHP_VERSION=${{ matrix.php }} -e OPAQUE_TEST_PHP_VARIANT=${{ matrix.variant }} opaque-check:${{ matrix.php }}-${{ matrix.variant }} sh -c 'tar -x -C /work && sh tests/check.sh'
