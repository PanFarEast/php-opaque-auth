name: Checks
on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Build PHP and Rust test environment
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t opaque-check -f tests/Dockerfile .
      - name: Check extension, interoperability, and local PIE installation
        shell: bash
        run: |
          set -o pipefail
          git archive HEAD | docker run --rm -i opaque-check sh -c 'tar -x -C /work && sh tests/check.sh'
